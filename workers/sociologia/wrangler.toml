name = "sociologia"
main = "src/index.ts"
compatibility_date = "2025-09-23"

# Workers AI
[ai]
binding = "AI"

# D1: llm_sociolog
[[d1_databases]]
binding = "DB"
database_name = "llm_sociolog"
database_id = "ea9cad56-9b03-4af7-b15b-4e923bbc66c7"

# KV: RATE_LIMIT (rate limiting + premium token + telemetría)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2f279c63ddbf45f19aaf55a02d290b47"

# Vectorize: retrieval semántico (activado sesión 35)
# Índice creado con:
#   npx wrangler vectorize create sociologia-embeddings --dimensions=1024 --metric=cosine
# 1024 dims = tamaño del output del modelo @cf/baai/bge-large-en-v1.5
# cosine = métrica estándar para embeddings de texto normalizados
[[vectorize]]
binding = "VECTORIZE"
index_name = "sociologia-embeddings"

# deploy trigger: 2026-05-25
